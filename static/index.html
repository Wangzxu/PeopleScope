<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeopleScope - AI Chat Interface</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div class="container">
        <!-- Main Chat Area -->
        <div class="chat-panel">
            <header class="chat-header">
                <h2 id="current-session-title">
                    <span class="status-dot"></span>
                    <span class="text">选择或创建一个会话</span>
                </h2>
            </header>
            
            <div id="chat-window">
                <div class="bot-message message">
                    <i class="fas fa-robot" style="margin-right: 8px;"></i>
                    你好！我是 PeopleScope AI。
                </div>
            </div>
            <form id="chat-form">
                <input type="text" id="message-input" placeholder="输入消息..." autocomplete="off" disabled>
                <button type="submit" id="send-button" disabled title="发送">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
            
            <div id="loading-overlay">
                <div class="spinner"></div>
                <div>正在处理...</div>
            </div>
        </div>

        <!-- Sidebar Info Panel -->
        <div class="info-panel">
            <div class="info-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h3 style="margin: 0;"><i class="fas fa-history"></i> 会话列表</h3>
                    <button id="new-chat-btn" style="background: none; border: none; cursor: pointer; color: var(--primary-color); padding: 5px; font-size: 1.1rem;" title="新建会话">
                        <i class="fas fa-plus-circle"></i>
                    </button>
                </div>
                <ul id="session-list">
                    <!-- Sessions loaded here -->
                </ul>
            </div>
            
            <div class="info-section">
                <h3><i class="fas fa-chart-radar"></i> 用户人格画像</h3>
                <div class="chart-container">
                    <canvas id="radarChart"></canvas>
                </div>
                <div id="user-tags"></div>
                <div id="user-summary" class="empty-state">
                    暂无画像数据，请点击下方按钮生成。
                </div>
            </div>
            
            <div class="info-section action-buttons">
                <h3><i class="fas fa-cogs"></i> 操作</h3>
                <button id="generate-profile-btn">
                    <i class="fas fa-magic"></i> 生成/更新用户画像
                </button>
                <button id="get-aggregation-btn">
                    <i class="fas fa-sync-alt"></i> 刷新画像数据
                </button>
            </div>
        </div>
    </div>

    <div id="context-menu" class="dropdown-menu">
        <button id="menu-rename"><i class="fas fa-edit"></i> 重命名</button>
        <button id="menu-delete" class="delete-btn"><i class="fas fa-trash"></i> 删除</button>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 class="modal-title">删除会话</h3>
            <p class="modal-body">确定要删除这个会话吗？此操作无法撤销。</p>
            <div class="modal-actions">
                <button id="cancel-delete-btn" class="modal-btn cancel">取消</button>
                <button id="confirm-delete-btn" class="modal-btn confirm">删除</button>
            </div>
        </div>
    </div>

    <!-- Match Profile Drawer -->
    <div id="profile-drawer-overlay" class="drawer-overlay">
        <div class="profile-drawer">
            <div class="drawer-header">
                <h2><i class="fas fa-heart"></i> 候选人详情</h2>
                <button class="close-drawer-btn" id="close-drawer-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="drawer-content" id="drawer-content">
                <!-- Content injected dynamically via JS -->
            </div>
        </div>
    </div>

    <script src="./js/main.js"></script>
</body>
</html>
